# OPTIONAL local database for those who prefer Docker over a local PostgreSQL install.
# Start with `npm run db:up`. Same user, password and database as .env.example.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unzanac
      POSTGRES_PASSWORD: unzanac_dev
      POSTGRES_DB: unzanac
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unzanac -d unzanac"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
