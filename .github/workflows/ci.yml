name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://unzanac:unzanac_dev@localhost:5432/unzanac?schema=public
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  NEXT_TELEMETRY_DISABLED: "1"
  # CI-only values; real secrets live in the hosting provider, never in the repo.
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  BETTER_AUTH_URL: http://localhost:3100
  # E2E tests reset this database on every run (tests/e2e/global-setup.ts).
  E2E_DATABASE_URL: postgresql://unzanac:unzanac_dev@localhost:5432/unzanac_test?schema=public

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Build, migrations, E2E, accessibility, budgets
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: unzanac
          POSTGRES_PASSWORD: unzanac_dev
          POSTGRES_DB: unzanac
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U unzanac -d unzanac"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations and seed
        run: npm run db:deploy && npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright (phone size, axe, byte budgets, admin flows)
        run: npm run test:e2e
      - name: Lighthouse CI
        run: |
          npm run start -- -p 3100 &
          npx wait-on@8 http://localhost:3100
          npx @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
